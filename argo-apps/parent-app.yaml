apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-cluster2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anraman1/acm_config.git
    targetRevision: main
    path: argo-apps/apps-apps
  destination:
    name: in-cluster
    namespace: payment
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true